# tox.ini — the single entry point for local CI. Every env installs from
# uv.lock via tox-uv's lock runner, so tox runs exactly what CI and local
# dev resolved. `--frozen` fails instead of re-resolving a stale lock.
[tox]
no_package = True
envlist = fmt, lint, mypy, django-checks, migrations, test

[testenv]
runner = uv-venv-lock-runner
uv_sync_flags =
    --frozen
passenv =
    SSL_CERT_FILE
    REQUESTS_CA_BUNDLE
    *_PROXY
    *_proxy
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.development
    SECRET_KEY = tox-insecure-secret-key

[testenv:fmt]
description = Python formatting (ruff format)
dependency_groups = lint
commands =
    ruff format --check .

[testenv:lint]
description = Python linting and import sorting (ruff)
dependency_groups = lint
commands =
    ruff check .

[testenv:mypy]
description = Type hints (mypy)
dependency_groups = type
# Directories, not an app list, so a new app is checked without an edit here.
commands =
    mypy apps/ config/ tests/

[testenv:django-checks]
description = Django system checks
dependency_groups = test
commands =
    python manage.py check --fail-level WARNING

[testenv:migrations]
description = Fail on model changes with no migration
dependency_groups = test
commands =
    python manage.py makemigrations --dry-run --check --verbosity 3

[testenv:test]
description = Run tests with coverage
dependency_groups = test
# --cov=apps measures the whole package, so a new app is covered without
# an edit here.
commands =
    pytest --cov=apps --cov-report=term-missing tests/ {posargs}
