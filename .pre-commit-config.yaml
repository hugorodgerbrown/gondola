repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Empty trailing columns in a TSV are significant.
        exclude: \.tsv$
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Must match tox.ini's [testenv:mypy] target list.
        entry: .venv/bin/mypy apps/ config/ tests/
        language: system
        types: [python]
        pass_filenames: false
