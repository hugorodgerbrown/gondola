# render.yaml — Render blueprint, in the shape bin/titan (the Titan
# provisioner in django-titan-template) expects: a web service named after
# the app and a daily clean-up cron job named <app>-purge.
#
# It uses the existing shared-db Postgres instance rather than a database of
# its own. The evening email is not scheduled: run `send_evening_emails
# --commit` by hand (Render shell) when wanted.
#
# DATABASE_URL points at a database of the app's own on shared-db (e.g.
# .../resort_planner), never at another app's database: Django's tables
# (auth, sessions, migrations) would clash. Secrets marked `sync: false`
# are entered in the Render dashboard when the blueprint is first applied
# (Render only prompts for them at service scope, never inside an
# environment group); nothing secret lives in this file.

envVarGroups:
  - name: resort-planner
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SITE_NAME
        value: Gondola
      # SMTP host, user, password and sender are set per service below.
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"

services:
  - type: web
    name: resort-planner
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run --no-sync python manage.py collectstatic --noinput
    preDeployCommand: >-
      uv run --no-sync python manage.py migrate --noinput &&
      uv run --no-sync python manage.py import_resorts --commit
    startCommand: uv run --no-sync gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    # Answers 200 while the process is up; no sign-in, no database query.
    # (/healthz also reads the database; bin/titan checks it after a deploy.)
    healthCheckPath: /livez
    envVars:
      - fromGroup: resort-planner
      # The shared-db internal URL, with this app's own database name.
      - key: DATABASE_URL
        sync: false
      # The public address, for links in emails (e.g. https://resort-planner.onrender.com).
      - key: SITE_URL
        sync: false
      # SMTP for sign-in links and the evening email (e.g. Resend's relay:
      # smtp.resend.com, 587, user "resend", the API key as the password).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Deletes expired sessions once a day. bin/titan copies DATABASE_URL to it
  # from the web service.
  - type: cron
    name: resort-planner-purge
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "17 3 * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python manage.py clearsessions
    envVars:
      - fromGroup: resort-planner
      - key: DATABASE_URL
        sync: false
