# render.yaml — Render blueprint: one web service, named after the app as
# titan (the Titan provisioner in django-titan-template) expects.
#
# It uses the existing shared-db Postgres instance rather than a database of
# its own, and there are no scheduled jobs for now (so no <app>-purge cron
# job): run `send_evening_emails --commit` by hand (Render shell) when wanted.
#
# Settings come from two env groups that titan makes and fills; they are
# referenced here, not declared, so a Blueprint sync never overwrites them:
#
# - titan: shared by every Titan app (DJANGO_DEBUG, PYTHON_VERSION, hosts
#   and CSRF origins under ultraniche.ai, the SMTP relay).
# - gondola: this app's own (DATABASE_URL, DJANGO_SECRET_KEY, the mail key
#   and sender, SITE_URL).
#
# A value set on the service itself wins over both groups, so an override
# for this app goes there. Nothing secret lives in this file.

services:
  - type: web
    name: gondola
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run --no-sync python manage.py collectstatic --noinput
    preDeployCommand: >-
      uv run --no-sync python manage.py migrate --noinput &&
      uv run --no-sync python manage.py import_resorts --commit
    startCommand: uv run --no-sync gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    # Answers 200 while the process is up; no sign-in, no database query.
    # (/healthz also reads the database; titan checks it after a deploy.)
    healthCheckPath: /livez
    envVars:
      - fromGroup: titan
      - fromGroup: gondola
      # manage.py defaults to development settings; the pre-deploy commands
      # run through it.
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
